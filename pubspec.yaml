name: freecal
description: "FreeCal - A unified multi-calendar Flutter application with smart mirroring and privacy controls."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Navigation
  go_router: ^14.6.2

  # Calendar UI
  table_calendar: ^3.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_colorpicker: ^1.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
